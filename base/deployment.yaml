apiVersion: apps/v1
kind: Deployment
metadata:
  name: tinysearch
  namespace: tinysearch
  labels:
    app: tinysearch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tinysearch
  template:
    metadata:
      labels:
        app: tinysearch
    spec:
      # No runAsNonRoot/runAsUser here: the upstream image's
      # docker-entrypoint.sh deliberately starts as root (to chown the
      # bind-mounted /config, whose UID/GID won't match the in-image
      # `tinysearch` user) then drops privilege itself via `gosu tinysearch`.
      # Forcing non-root at the pod level would break that entrypoint before
      # it ever gets to drop privilege on its own.
      containers:
      - name: tinysearch
        image: marcellm01/tinysearch:v0.4.1
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: TINYSEARCH_MODELS_DIR
          value: /data/models
        - name: TINYSEARCH_CONFIG_PATH
          value: /config/tinysearch_config.json
        - name: MCP_TRANSPORT
          value: streamable-http
        - name: MCP_HOST
          value: 0.0.0.0
        - name: MCP_PORT
          value: "8000"
        - name: SEARXNG_URL
          value: http://searxng.searxng.svc.cluster.local/search
        # D-012 (VPA epic homelab#455): requests right-sized from the
        # Off-mode VPA's measured target. Limits per D-022 (homelab#1212). See notes in the PR body.
        resources:
          requests:
            cpu: 25m
            memory: 1472Mi
          limits:
            memory: 2272Mi
        volumeMounts:
        - name: models
          mountPath: /data/models
        - name: config
          mountPath: /config
          readOnly: true
        - name: dshm
          mountPath: /dev/shm
          # Probes added 2026-09-03 (homelab#431 follow-up). This container had NO probe
          # of any kind, so a wedged process reads Ready forever and nothing restarts it.
          # Home Assistant proved the cost: HTTP dead, no logs, ~1 core spinning, 2.4 days,
          # and Kubernetes called it healthy throughout because it had nothing to check.

          # Three tiers, mirroring the proven ollama scheme: startup has a generous
          # ceiling so a slow first boot is never killed; readiness is tight and only
          # de-routes traffic; liveness is loose and restarts a genuinely stuck process.

          # The target below was probed live before this was written -- a liveness probe
          # pointed at a URL that 404s restart-loops the pod, which is worse than none.
        startupProbe:
          tcpSocket:
            port: 8000
          periodSeconds: 10
          failureThreshold: 30
        readinessProbe:
          tcpSocket:
            port: 8000
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          tcpSocket:
            port: 8000
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 4
      volumes:
      - name: models
        persistentVolumeClaim:
          claimName: tinysearch-models
      - name: config
        configMap:
          name: tinysearch-config
      # Chromium (bundled in the image, used for page rendering during
      # research/scrape) needs more than Kubernetes' default 64Mi /dev/shm;
      # matches upstream's own compose.yaml shm_size: "1gb".
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 1Gi
