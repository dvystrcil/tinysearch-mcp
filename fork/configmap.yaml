# The stock config (base/configmap.yaml) plus the fork's settings. The
# JSON is a single string, so the whole value is restated here: keep the rest
# in step with base.
#
# search_engines: the home IP is flagged by DuckDuckGo and Google, and bing
# answers with off-topic results (homelab#1934). Ask SearXNG for Brave's
# key-based API (opt-in there, ~1,000 free requests a month) plus the free
# engines that returned relevant results from the home IP when every
# general engine was tested on 2026-11-24. "duckduckgo web" is a different
# DuckDuckGo endpoint from the CAPTCHA'd "duckduckgo". Left out: yandex
# (Russian-law filtering, worst on world news), brave (cloaked URLs), bing.
apiVersion: v1
kind: ConfigMap
metadata:
  name: tinysearch-config
  namespace: tinysearch
data:
  tinysearch_config.json: |
    {
      "search_backend": "searxng",
      "search_backend_url": "http://searxng.searxng.svc.cluster.local/search",
      "search_backend_fallback": true,
      "search_engines": ["braveapi", "duckduckgo web", "yahoo", "privacywall", "mwmbl"],
      "search_region": "",
      "embedding_backend": "onnx",
      "embedding_model": "fast",
      "scrape_refused_host_ttl_seconds": 600
    }
