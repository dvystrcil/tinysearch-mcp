# The stock config (base/configmap.yaml) plus the fork's settings. The
# JSON is a single string, so the whole value is restated here: keep the rest
# in step with base.
#
# search_engines + search_categories: the home IP is flagged by DuckDuckGo and
# Google (homelab#1934). braveapi (Brave's key-based API, ~1,000 free requests
# a month) is off by default in SearXNG, so it is named here; "general" adds
# every engine SearXNG has on by default (searxng#24 picks those). Needs
# tinysearch-fork >= 0.7.3 (TinySearch#12): an older image ignores
# search_categories and would search braveapi alone.
apiVersion: v1
kind: ConfigMap
metadata:
  name: tinysearch-config
  namespace: tinysearch
data:
  tinysearch_config.json: |
    {
      "search_backend": "searxng",
      "search_backend_url": "http://searxng.searxng.svc.cluster.local/search",
      "search_backend_fallback": true,
      "search_engines": ["braveapi"],
      "search_categories": ["general"],
      "search_region": "",
      "embedding_backend": "onnx",
      "embedding_model": "fast",
      "scrape_refused_host_ttl_seconds": 600
    }
