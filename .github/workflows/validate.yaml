name: validate
on: [pull_request]
jobs:
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dvystrcil/kustomize-validate-action@v1
  fork:
    # The side-by-side fork (fork/, #32): render checks only. The image is a
    # release of the private dvystrcil/tinysearch-fork-docker (#35), whose tag
    # (X.Y.Z-refused-hosts) no longer names the fork commit, and Harbor's ai/
    # project is unreachable from here. The builder checks the image itself
    # (MCP initialize and the refused-host setting) before pushing it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: tests/validate-fork.sh
        env:
          SKIP_IMAGE: "1"
